<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC27 Market Price Engine</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #07100a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
        max-width: 600px;
        margin: auto;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 4px;
    }

    .subtitle {
        color: #9cff75;
        font-size: 13px;
        margin-bottom: 20px;
    }

    .card {
        background: #111b14;
        border: 1px solid #263c2b;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 15px;
    }

    label {
        display: block;
        font-size: 13px;
        color: #aaa;
        margin-bottom: 8px;
    }

    textarea {
        width: 100%;
        min-height: 160px;
        background: #080d09;
        color: #ffffff;
        border: 1px solid #38523d;
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
        resize: vertical;
    }

    button {
        width: 100%;
        margin-top: 12px;
        padding: 13px;
        border: 0;
        border-radius: 10px;
        background: #39ff00;
        color: #001000;
        font-weight: 800;
        font-size: 15px;
    }

    .result {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #263c2b;
    }

    .result:last-child {
        border-bottom: 0;
    }

    .value {
        font-weight: 800;
        color: #9cff75;
    }

    .warning {
        color: #ffd166;
        font-size: 13px;
        margin-top: 10px;
    }

    .confidence {
        font-size: 18px;
        font-weight: 800;
    }

    .cluster {
        margin-top: 8px;
        padding: 10px;
        background: #0b140d;
        border-radius: 9px;
        font-size: 13px;
    }

    pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        color: #baffaa;
    }
</style>
</head>

<body>

<div class="container">

    <h1>FC27 Market Price Engine</h1>

    <div class="subtitle">
        Read-only market analysis • Cluster-based pricing
    </div>

    <div class="card">

        <label>
            Paste Buy Now prices from the Transfer Market
        </label>

        <textarea id="prices" placeholder="Example:

12000
12000
12000
12500
12500
13000
14000
15000"></textarea>

        <button id="calculate">
            CALCULATE MARKET PRICE
        </button>

    </div>

    <div class="card" id="results" style="display:none">

        <div class="result">
            <span>Listings analysed</span>
            <span class="value" id="count">-</span>
        </div>

        <div class="result">
            <span>Market selling price</span>
            <span class="value" id="sellPrice">-</span>
        </div>

        <div class="result">
            <span>EA tax (5%)</span>
            <span class="value" id="tax">-</span>
        </div>

        <div class="result">
            <span>Break-even Buy Now</span>
            <span class="value" id="breakEven">-</span>
        </div>

        <div class="result">
            <span>Safety buffer</span>
            <span class="value" id="buffer">-</span>
        </div>

        <div class="result">
            <span>Suggested Buy Now</span>
            <span class="value" id="buyPrice">-</span>
        </div>

        <div class="result">
            <span>Expected profit</span>
            <span class="value" id="profit">-</span>
        </div>

        <div class="result">
            <span>ROI</span>
            <span class="value" id="roi">-</span>
        </div>

        <div class="result">
            <span>Confidence</span>
            <span class="confidence" id="confidence">-</span>
        </div>

        <div class="cluster" id="clusterInfo"></div>

        <div class="warning" id="warning"></div>

    </div>

</div>
<script>

function formatCoins(number) {
    return Math.round(number).toLocaleString("en-IN");
}


/* Convert pasted prices into numbers */
function parsePrices(text) {

    return text
        .split(/[\n,; ]+/)
        .map(v => v.trim().toLowerCase())
        .filter(Boolean)
        .map(v => {

            if (v.endsWith("k")) {
                return parseFloat(v.replace("k", "")) * 1000;
            }

            return parseFloat(
                v.replace(/[^0-9.]/g, "")
            );
        })
        .filter(v => Number.isFinite(v) && v > 0);
}


/*
    The important part:

    Instead of fixed ₹1,000 buckets,
    we group nearby prices together.

    Example:

    27,500
    28,000
    28,250
    28,500
    28,750
    29,000

    = ONE market cluster.
*/


function getGapThreshold(median) {

    if (median < 25000) return 750;
    if (median < 50000) return 1000;
    if (median < 100000) return 2000;

    return 5000;
}


function createClusters(prices) {

    const sorted = [...prices].sort(
        (a, b) => a - b
    );

    const median =
        sorted[Math.floor(sorted.length / 2)];

    const gapThreshold =
        getGapThreshold(median);

    const clusters = [];

    let current = [sorted[0]];

    for (let i = 1; i < sorted.length; i++) {

        const previous = sorted[i - 1];
        const currentPrice = sorted[i];

        const gap =
            currentPrice - previous;

        if (gap <= gapThreshold) {

            current.push(currentPrice);

        } else {

            clusters.push(current);

            current = [currentPrice];
        }
    }

    clusters.push(current);

    return clusters.map(values => {

        const min = Math.min(...values);
        const max = Math.max(...values);

        const span = max - min;

        const count = values.length;

        /*
            Density rewards clusters that contain
            many listings in a relatively small range.
        */

        const density =
            count / Math.max(span, 500);

        return {
            values,
            min,
            max,
            span,
            count,
            density
        };

    });
}


/*
    Find the genuine market cluster.

    We don't blindly choose the largest cluster.

    A cluster must have:
    - enough listings
    - reasonable density
    - not be an obvious isolated outlier
*/


function findMarketCluster(clusters, total) {

    const candidates =
        clusters.filter(cluster => {

            return cluster.count >= 3;

        });


    if (candidates.length === 0) {
        return null;
    }


    candidates.sort((a, b) => {

        /*
            First preference:
            number of listings
        */

        if (b.count !== a.count) {
            return b.count - a.count;
        }


        /*
            If counts are equal,
            prefer the tighter cluster.
        */

        return b.density - a.density;

    });


    return candidates[0];
}


/*
    Determine whether another cluster is
    actually an outlier.

    Example:

    Main market: 27.5k–29k
    High cluster: 60k

    60k is far enough away to be ignored.
*/


function isFarOutlier(cluster, marketCluster) {

    const distanceAbove =
        cluster.min - marketCluster.max;

    const distanceBelow =
        marketCluster.min - cluster.max;

    const distance =
        Math.max(
            distanceAbove,
            distanceBelow
        );


    const marketBase =
        Math.max(
            marketCluster.min,
            1000
        );


    return distance > marketBase * 0.20;
}


/*
    Calculate the complete market plan.
*/

function calculateMarket(prices) {

    const sorted =
        [...prices].sort(
            (a, b) => a - b
        );


    const clusters =
        createClusters(sorted);


    const marketCluster =
        findMarketCluster(
            clusters,
            sorted.length
        );


    if (!marketCluster) {
        return null;
    }


    /*
        Market selling price.

        We use the LOWER EDGE of the genuine
        market cluster.

        This avoids using a random expensive
        listing as the selling price.
    */

    const marketPrice =
        marketCluster.min;


    /*
        EA 5% tax.
    */

    const tax =
        Math.floor(
            marketPrice * 0.05
        );


    const breakEven =
        marketPrice - tax;


    /*
        Dynamic safety buffer.

        Strong cluster:
        10+ listings → ₹500

        Good cluster:
        6–9 → ₹750

        Smaller cluster:
        3–5 → ₹1,000
    */

    let buffer = 1000;

    if (marketCluster.count >= 10) {

        buffer = 500;

    } else if (marketCluster.count >= 6) {

        buffer = 750;

    }


    const suggestedBuy =
        Math.max(
            0,
            breakEven - buffer
        );


    const expectedProfit =
        Math.floor(
            marketPrice * 0.95 -
            suggestedBuy
        );


    const roi =
        suggestedBuy > 0
            ? expectedProfit /
              suggestedBuy * 100
            : 0;


    /*
        Cluster share.
    */

    const share =
        marketCluster.count /
        sorted.length;


    /*
        Confidence.
    */

    let confidence = "LOW";

    if (
        marketCluster.count >= 10 &&
        share >= 0.20
    ) {

        confidence = "HIGH";

    } else if (
        marketCluster.count >= 6 &&
        share >= 0.15
    ) {

        confidence = "MEDIUM";

    } else if (
        marketCluster.count >= 3 &&
        share >= 0.08
    ) {

        confidence = "LOW-MEDIUM";

    }


    /*
        Identify other clusters.
    */

    const otherClusters =
        clusters.filter(
            c => c !== marketCluster
        );


    const outliers =
        otherClusters.filter(
            c =>
                isFarOutlier(
                    c,
                    marketCluster
                )
        );


    return {

        total: sorted.length,

        marketCluster,

        marketPrice,

        tax,

        breakEven,

        buffer,

        suggestedBuy,

        expectedProfit,

        roi,

        confidence,

        clusters,

        outliers

    };
}


document
    .getElementById("calculate")
    .addEventListener(
        "click",
        function () {

            const text =
                document.getElementById(
                    "prices"
                ).value;


            const prices =
                parsePrices(text);


            if (prices.length < 3) {

                alert(
                    "Please enter at least 3 prices."
                );

                return;
            }


            const result =
                calculateMarket(prices);


            if (!result) {

                alert(
                    "Unable to identify a market cluster."
                );

                return;
            }


            document
                .getElementById("results")
                .style.display = "block";


            document
                .getElementById("count")
                .textContent =
                    result.total;


            document
                .getElementById("sellPrice")
                .textContent =
                    formatCoins(
                        result.marketPrice
                    );


            document
                .getElementById("tax")
                .textContent =
                    formatCoins(
                        result.tax
                    );


            document
                .getElementById("breakEven")
                .textContent =
                    formatCoins(
                        result.breakEven
                    );


            document
                .getElementById("buffer")
                .textContent =
                    formatCoins(
                        result.buffer
                    );


            document
                .getElementById("buyPrice")
                .textContent =
                    formatCoins(
                        result.suggestedBuy
                    );


            document
                .getElementById("profit")
                .textContent =
                    formatCoins(
                        result.expectedProfit
                    );


            document
                .getElementById("roi")
                .textContent =
                    result.roi.toFixed(1) + "%";


            document
                .getElementById("confidence")
                .textContent =
                    result.confidence;


            document
                .getElementById("clusterInfo")
                .innerHTML =

                "<b>Main market cluster:</b> " +

                formatCoins(
                    result.marketCluster.min
                ) +

                " – " +

                formatCoins(
                    result.marketCluster.max
                ) +

                "<br>" +

                "<b>Listings in cluster:</b> " +

                result.marketCluster.count +

                " / " +

                result.total +

                "<br>" +

               "<b>Other clusters:</b> " +
                (result.clusters.length - 1);


            let warning = "";


            if (
                result.confidence === "HIGH"
            ) {

                warning =
                    "✓ Strong market cluster detected.";

            } else if (
                result.confidence === "MEDIUM"
            ) {

                warning =
                    "✓ Good market cluster detected.";

            } else if (
                result.confidence === "LOW-MEDIUM"
            ) {

                warning =
                    "⚠️ Market cluster is usable, but more listings would improve confidence.";

            } else {

                warning =
                    "⚠️ Market is fragmented. Treat the result cautiously.";

            }


            if (
                result.outliers.length > 0
            ) {

                warning +=
                    " High/low isolated price clusters were ignored.";
            }


            document
                .getElementById("warning")
                .textContent =
                    warning;

        }
    );

</script>

</body>
</html>
